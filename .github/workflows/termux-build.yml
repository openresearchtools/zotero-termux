name: Native Bionic Zotero packages
on:
  push:
    branches: [main]
    paths:
      - 'termux/**'
      - '.github/workflows/termux-build.yml'
      - '.github/workflows/termux-native.yml'
      # These documents do not change package inputs.
      - '!termux/README.md'
      - '!termux/UPSTREAM_HISTORY.md'
      - '!termux/VALIDATION.md'
  workflow_dispatch:
    inputs:
      architecture:
        description: Package architecture to build
        type: choice
        default: all
        options: [all, aarch64, x86_64]
      gecko_run:
        description: 'Reuse zotero-gecko-aarch64 from this run ID (must match current Gecko inputs)'
        required: false
        type: string
      gecko_release:
        description: 'Reuse zotero-gecko-aarch64.tar.gz from this release tag (must match current Gecko inputs)'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'termux/**'
      - '.github/workflows/termux-build.yml'
      - '.github/workflows/termux-native.yml'
      - '!termux/README.md'
      - '!termux/UPSTREAM_HISTORY.md'
      - '!termux/VALIDATION.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  aarch64:
    if: inputs.architecture != 'x86_64'
    uses: ./.github/workflows/termux-native.yml
    with:
      source_sha: ${{ github.sha }}
      architecture: aarch64
      gecko_run: ${{ inputs.gecko_run || '' }}
      gecko_release: ${{ inputs.gecko_release || '' }}
  x86_64:
    if: github.event_name != 'pull_request' && inputs.architecture != 'aarch64'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Dispatch isolated x86_64 build and collect its packages
        env:
          GH_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
        run: python3 termux/scripts/remote-build.py "$RUNNER_TEMP/x86_64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zotero-termux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/x86_64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
