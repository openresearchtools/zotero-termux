name: Build native Linux Zotero package
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      architecture:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openresearchtools/zotero-termux
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: npm
      - name: Install build and native inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils curl dpkg-dev git-lfs patch rsync unzip zip xvfb xauth dbus-x11
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/xulrunner/firefox-*.tar.xz
          key: zotero-linux-gecko-${{ inputs.architecture }}-${{ hashFiles('linux/upstream.json') }}
      - name: Build updated Zotero source with desktop automation patches
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: bash linux/scripts/build.sh "$ARCHITECTURE" "$RUNNER_TEMP/packages"
      - name: Verify source, package architecture, dependencies and checksums
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 linux/scripts/verify.py "$RUNNER_TEMP/packages" --architecture "$ARCHITECTURE" --source-sha "$SOURCE_SHA"
      - name: Install through APT with only the declared mandatory dependencies
        run: sudo apt-get install --yes --no-install-recommends "$RUNNER_TEMP"/packages/zotero_*.deb
      - name: Check installed libraries, local API and LibreOffice Java registration
        run: |
          LD_LIBRARY_PATH=/usr/lib/zotero ldd /usr/lib/zotero/libxul.so > "$RUNNER_TEMP/linked-libraries.txt"
          cat "$RUNNER_TEMP/linked-libraries.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/linked-libraries.txt"
          dbus-run-session -- xvfb-run -a python3 linux/scripts/smoke.py /usr/lib/zotero
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zotero-linux-${{ inputs.architecture }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
